description = "Dataquartz AI with Hybrid Sync/Async Tool Routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.34.0",
    "supabase>=2.10.0",
    "python-dotenv>=1.1.0",
    "langchain-groq>=0.1.3",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langgraph>=0.2.0",
    "mcp>=1.0.0",
    "fastmcp==0.4.1",
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",
    "httpx>=0.28.0",
]

[tool.uv]
package-mode = false
